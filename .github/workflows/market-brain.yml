# ======================================================
#  시황두뇌 v9 — 뉴스 통합 + Gemini 해석 + 웹페이지(GitHub Pages)
#  저장 위치: .github/workflows/market-brain.yml
#  필요: GitHub Secret  GEMINI_API_KEY
# ======================================================
name: 시황두뇌

on:
  schedule:
    - cron: '0 23 * * 0-4'   # KST 08:00
    - cron: '0 0-8 * * 1-5'  # KST 09:00~17:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-brain

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "yfinance>=0.2.40" "pandas>=2.0" "anthropic>=0.40"

      - name: 코드 준비
        run: |
          cat > brain.py << 'PYEOF'
          # 시황두뇌 v9 — Gemini 자동 선택 + GitHub Pages 페이지 생성
          import json, os, re, statistics, html
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET
          import pandas as pd, yfinance as yf
          
          ROOT = Path("."); DATA = ROOT / "docs" / "data"; DATA.mkdir(parents=True, exist_ok=True)
          KST = timezone(timedelta(hours=9)); NOW = datetime.now(KST)
          MODEL = os.getenv("CLAUDE_MODEL") or "claude-haiku-5-5"
          GEMINI_MODELS = [m for m in [os.getenv("GEMINI_MODEL"), "gemini-flash-latest", "gemini-3-flash", "gemini-2.5-flash-lite"] if m]
          MIN_CHANGE = float(os.getenv("MIN_CHANGE_PCT") or 0.3)
          MAX_HEADLINES = 45
          
          TICKERS = {"^KS11": "KOSPI", "^KQ11": "KOSDAQ", "KRW=X": "USD/KRW", "^GSPC": "S&P 500", "^IXIC": "NASDAQ",
                     "^VIX": "VIX", "^TNX": "US 10Y", "CL=F": "WTI 유가", "GLD": "금", "TLT": "미국 장기채",
                     "069500.KS": "KODEX 200", "229200.KS": "KODEX 코스닥150", "091160.KS": "KODEX 반도체",
                     "305720.KS": "KODEX 2차전지", "XLK": "美 Tech", "XLF": "美 금융", "XLE": "美 에너지"}
          BASE_WEIGHTS = {
              "risk_on":  {"KODEX 200": 25, "KODEX 코스닥150": 15, "S&P 500": 25, "NASDAQ": 15, "채권": 10, "금": 5, "현금": 5},
              "neutral":  {"KODEX 200": 20, "KODEX 코스닥150": 5,  "S&P 500": 25, "NASDAQ": 10, "채권": 20, "금": 10, "현금": 10},
              "risk_off": {"KODEX 200": 10, "KODEX 코스닥150": 0,  "S&P 500": 15, "NASDAQ": 5,  "채권": 30, "금": 15, "현금": 25}}
          # 뉴스 소스 (RSS). 막히는 곳은 자동 건너뜀
          FEEDS = {
              "연합뉴스 경제": "https://www.yna.co.kr/rss/economy.xml",
              "한국경제 증권": "https://www.hankyung.com/feed/finance",
              "매일경제 증권": "https://www.mk.co.kr/rss/50200011/",
              "매일경제 경제": "https://www.mk.co.kr/rss/30100041/",
              "Yahoo Finance": "https://finance.yahoo.com/news/rssindex",
              "Investing.com": "https://www.investing.com/rss/news.rss",
              "CNBC Markets": "https://www.cnbc.com/id/20910258/device/rss/rss.html",
              "MarketWatch": "https://feeds.content.dowjones.io/public/rss/mw_topstories",
          }
          
          # ---------- 뉴스 ----------
          def fetch_news():
              items, status = [], {}
              for src, url in FEEDS.items():
                  try:
                      req = Request(url, headers={"User-Agent": "Mozilla/5.0 (market-brain rss reader)"})
                      xml = urlopen(req, timeout=15).read()
                      root = ET.fromstring(xml)
                      n = 0
                      for it in root.iter():
                          if it.tag.split("}")[-1] not in ("item", "entry"): continue
                          title = ""; link = ""
                          for ch in it:
                              t = ch.tag.split("}")[-1]
                              if t == "title": title = html.unescape(re.sub(r"<[^>]+>", "", ch.text or "")).strip()
                              elif t == "link": link = (ch.text or ch.attrib.get("href") or "").strip()
                          if title and len(title) > 8:
                              items.append({"src": src, "title": title[:120], "link": link}); n += 1
                          if n >= 12: break
                      status[src] = n
                  except Exception as e:
                      status[src] = f"실패 {type(e).__name__}"
              seen, out = set(), []
              for it in items:
                  k = re.sub(r"\W", "", it["title"])[:30]
                  if k not in seen: seen.add(k); out.append(it)
              # 시장 관련 키워드 우선
              kw = re.compile(r"코스피|코스닥|증시|주가|금리|연준|Fed|환율|반도체|실적|국채|유가|관세|stocks?|market|rate|inflation|Treasury|earnings|Nasdaq|S&P|Dow|tariff", re.I)
              out.sort(key=lambda x: 0 if kw.search(x["title"]) else 1)
              return out[:MAX_HEADLINES], status
          
          # ---------- 시세 ----------
          def collect():
              df = yf.download(list(TICKERS), period="6mo", interval="1d", auto_adjust=True, progress=False, group_by="column")["Close"]
              df = df.dropna(how="all").tail(90)
              return {s: [None if pd.isna(v) else float(v) for v in df[s].ffill()] for s in TICKERS if s in df.columns and not df[s].isna().all()}
          
          def pct(a, b): return None if not a or not b else round((a / b - 1) * 100, 2)
          
          def indicators(c):
              c = [v for v in c if v is not None]
              if len(c) < 25: return {}
              last, ma20 = c[-1], statistics.fmean(c[-20:]); ma60 = statistics.fmean(c[-60:]) if len(c) >= 60 else None
              return {"last": round(last, 2), "d1": pct(last, c[-2]), "d5": pct(last, c[-6]), "d20": pct(last, c[-21]),
                      "vs_ma20": pct(last, ma20), "vs_ma60": pct(last, ma60) if ma60 else None}
          
          def regime_of(ind):
              score, why = 0, []
              for name, x in (("S&P500", ind.get("^GSPC", {})), ("NASDAQ", ind.get("^IXIC", {})), ("KOSPI", ind.get("^KS11", {}))):
                  if x.get("vs_ma20") is not None:
                      if x["vs_ma20"] > 0 and (x.get("vs_ma60") or 0) > 0: score += 1; why.append(f"{name} 상승추세(20/60일선 위)")
                      elif x["vs_ma20"] < 0 and (x.get("vs_ma60") or 0) < 0: score -= 1; why.append(f"{name} 하락추세(20/60일선 아래)")
              vix = ind.get("^VIX", {}).get("last")
              if vix is not None:
                  if vix < 16: score += 1; why.append(f"VIX {vix:.0f} 안정")
                  elif vix > 25: score -= 2; why.append(f"VIX {vix:.0f} 공포 구간")
              k = ind.get("KRW=X", {}).get("d20")
              if k is not None:
                  if k > 2: score -= 1; why.append("원화 약세(외국인 이탈 우려)")
                  elif k < -2: score += 1; why.append("원화 강세")
              return ("risk_on" if score >= 2 else "risk_off" if score <= -2 else "neutral"), score, why
          
          # ---------- AI ----------
          SYSTEM = """너는 한국·미국 시장을 함께 보는 시황 애널리스트다. 독자는 숫자 나열이 아니라 '지금 시장에서 무슨 일이 벌어지고 있고, 그래서 왜 이 비중인가'를 알고 싶어한다.
          입력: 오늘의 뉴스 헤드라인 목록, 주요 지표, 규칙 기반 기본 비중.
          할 일:
          1) 헤드라인을 읽고 오늘 시장을 움직이는 핵심 이슈 3~5개를 뽑아 서로 연결해 해석한다. 뻔한 지표 설명 대신 뉴스에 담긴 맥락(원인→영향)을 쓴다.
          2) 기본 비중을 출발점으로 뉴스 맥락을 반영해 최종 비중을 정한다(각 자산 ±10%p 이내 조정, 합계 100).
          3) 각 자산별로 '왜 이 비중인지'를 뉴스/지표를 근거로 한 문장씩 설명한다.
          규칙: 헤드라인과 지표에 없는 사실은 지어내지 않는다. 투자 권유가 아닌 참고 정보다. 한국어, 반드시 아래 JSON만 출력(마크다운 금지):
          {"headline":"오늘 시황 한 줄 제목","summary":"뉴스 기반 시황 해석 5~7문장","issues":[{"title":"이슈","detail":"왜 중요한지 1~2문장","impact":"긍정|부정|혼재"}],"weights":{"KODEX 200":0,"KODEX 코스닥150":0,"S&P 500":0,"NASDAQ":0,"채권":0,"금":0,"현금":0},"rationale":{"KODEX 200":"...","KODEX 코스닥150":"...","S&P 500":"...","NASDAQ":"...","채권":"...","금":"...","현금":"..."},"watch":["앞으로 지켜볼 것 1","2","3"]}"""
          
          def parse_out(text, payload):
              text = text.strip(); text = text[text.find("{"): text.rfind("}") + 1]
              out = json.loads(text)
              w = out.get("weights") or {}
              if abs(sum(w.values()) - 100) > 3 or set(w) != set(payload["base_weights"]): out["weights"] = payload["base_weights"]
              return out
          
          def gemini_candidates(key):
              """Google에 현재 사용 가능한 모델 목록을 물어 flash 계열을 새 버전 순으로 정렬"""
              cands = []
              try:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models?key={key}&pageSize=200"
                  data = json.loads(urlopen(Request(url), timeout=60).read().decode("utf-8"))
                  for m in data.get("models", []):
                      name = m.get("name", "").split("/")[-1]
                      if "generateContent" not in m.get("supportedGenerationMethods", []): continue
                      if not name.startswith("gemini-"): continue
                      if re.search(r"image|tts|live|audio|embedding|native|thinking|robotics|computer", name): continue
                      mv = re.search(r"gemini-(\d+(?:\.\d+)?)", name); ver = float(mv.group(1)) if mv else 0
                      score = ver * 100
                      if "flash" in name: score += 10
                      if "lite" in name: score -= 3
                      if "pro" in name: score -= 5          # 무료 한도가 낮아 flash 우선
                      if "preview" in name or "exp" in name: score -= 1
                      if re.search(r"-\d{3}$|-\d{2}-\d{2}$", name): score -= 0.5   # 날짜/번호 붙은 변형은 뒤로
                      cands.append((score, name))
              except Exception:
                  pass
              cands.sort(reverse=True)
              names = [n for _, n in cands]
              for fallback in GEMINI_MODELS:
                  if fallback not in names: names.append(fallback)
              return names[:6]
          
          def call_gemini(payload):
              key = os.environ["GEMINI_API_KEY"]; errors = []
              body = json.dumps({"systemInstruction": {"parts": [{"text": SYSTEM}]},
                                 "contents": [{"role": "user", "parts": [{"text": json.dumps(payload, ensure_ascii=False)}]}],
                                 "generationConfig": {"temperature": 0.3, "maxOutputTokens": 2000, "responseMimeType": "application/json"}}).encode()
              for model in gemini_candidates(key):
                  try:
                      url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}"
                      req = Request(url, data=body, method="POST", headers={"Content-Type": "application/json"})
                      data = json.loads(urlopen(req, timeout=120).read().decode("utf-8"))
                      text = "".join(p.get("text", "") for p in data["candidates"][0]["content"]["parts"])
                      out = parse_out(text, payload)
                      u = data.get("usageMetadata", {}); out["usage"] = {"in": u.get("promptTokenCount"), "out": u.get("candidatesTokenCount"), "model": model}
                      return out
                  except Exception as e:
                      detail = ""
                      try: detail = re.sub(r"\s+", " ", e.read().decode(errors="replace"))[:140]
                      except Exception: pass
                      errors.append(f"{model}: {type(e).__name__} {str(e)[:40]} {detail}")
              raise RuntimeError(" | ".join(errors))
          
          def call_claude(payload):
              from anthropic import Anthropic
              msg = Anthropic().messages.create(model=MODEL, max_tokens=1800, system=SYSTEM,
                                                messages=[{"role": "user", "content": json.dumps(payload, ensure_ascii=False)}])
              out = parse_out("".join(b.text for b in msg.content if getattr(b, "type", "") == "text"), payload)
              out["usage"] = {"in": msg.usage.input_tokens, "out": msg.usage.output_tokens, "model": MODEL}
              return out
          
          
          def needs_llm(sig, prev, news):
              if not prev or "summary" not in prev: return True, "첫 실행"
              if (prev.get("usage") or {}).get("model") == "rule-digest": return True, "AI 재시도"
              if sig["regime"] != prev.get("regime"): return True, "레짐 변경"
              old = set(n["title"] for n in prev.get("news", [])); new = sum(1 for n in news if n["title"] not in old)
              if new >= 8: return True, f"새 뉴스 {new}건"
              moved = max(abs((sig["headline_ind"][k].get("d1") or 0) - (prev.get("headline_ind", {}).get(k, {}).get("d1") or 0)) for k in sig["headline_ind"])
              if moved >= MIN_CHANGE: return True, f"지수 변동 {moved:.2f}%"
              if NOW.hour in (8, 17): return True, "정기 갱신"
              return False, f"변동 없음(새 뉴스 {new}건)"
          
          
          # ---------- AI 없이도 되는 뉴스 다이제스트 ----------
          THEMES = [("금리·연준", r"금리|연준|Fed|FOMC|국채|Treasury|yield|rate cut|inflation|물가"),
                    ("환율·외국인", r"환율|원화|달러|외국인|dollar|KRW|yen|엔화"),
                    ("반도체·AI", r"반도체|삼성전자|SK하이닉스|엔비디아|Nvidia|AI|chip|semiconductor|TSMC"),
                    ("실적·기업", r"실적|earnings|guidance|revenue|영업이익|매출"),
                    ("정치·관세", r"관세|tariff|선거|election|트럼프|Trump|정부|government|규제"),
                    ("유가·원자재·금", r"유가|oil|WTI|금값|gold|원자재|commodit"),
                    ("증시 전반", r"코스피|코스닥|증시|주가|stocks?|market|Nasdaq|S&P|Dow|급락|급등|rally|selloff")]
          
          def rule_digest(sig):
              news = sig["news"]; h = sig["headline_ind"]; regime = sig["regime"]
              groups = {}
              for n in news:
                  for name, pat in THEMES:
                      if re.search(pat, n["title"], re.I): groups.setdefault(name, []).append(n["title"]); break
              issues = [{"title": k, "detail": " / ".join(t[:60] for t in v[:2]), "impact": "혼재"} for k, v in sorted(groups.items(), key=lambda x: -len(x[1]))[:5]]
              rk = {"risk_on": "위험선호", "neutral": "중립", "risk_off": "위험회피"}[regime]
              k, s_, n_ = h.get("KOSPI", {}), h.get("S&P 500", {}), h.get("NASDAQ", {})
              fx, vix = h.get("USD/KRW", {}), h.get("VIX", {})
              lead = ", ".join(f"{t}({len(v)}건)" for t, v in sorted(groups.items(), key=lambda x: -len(x[1]))[:3]) or "특이 테마 없음"
              summary = (f"오늘 뉴스의 중심은 {lead}입니다. 코스피는 하루 {k.get('d1')}%, 5일 {k.get('d5')}%, S&P500은 하루 {s_.get('d1')}%, "
                         f"나스닥은 {n_.get('d1')}% 움직였고 VIX는 {vix.get('last')}, 원달러는 20일간 {fx.get('d20')}% 변했습니다. "
                         f"추세·변동성·환율 신호를 합치면 현재 레짐은 '{rk}'이며, 규칙 신호는 {'; '.join(sig['reasons'])}입니다. "
                         f"(AI 해석이 비활성화되어 규칙 기반으로 작성됨)")
              why = {"risk_off": {"KODEX 200": "국내 지수가 추세 아래에 있어 비중 축소", "KODEX 코스닥150": "변동성 큰 중소형주는 위험회피 구간에서 제외",
                                  "S&P 500": "미국 대형주도 추세 이탈, 핵심 비중만 유지", "NASDAQ": "고밸류 성장주는 금리·변동성에 취약해 최소화",
                                  "채권": "위험회피 국면의 방어 핵심 자산", "금": "달러·지정학 불안 헤지", "현금": "반등 시 재진입 여력 확보"},
                     "neutral": {"KODEX 200": "신호 혼재, 기본 비중 유지", "KODEX 코스닥150": "소폭만 편입", "S&P 500": "미국 대형주 기본 비중",
                                 "NASDAQ": "성장주 중립 비중", "채권": "균형용 방어 자산", "금": "분산 목적", "현금": "기회 대기"},
                     "risk_on": {"KODEX 200": "국내 상승추세 추종", "KODEX 코스닥150": "위험선호 시 중소형주 베타 확보", "S&P 500": "미국 대형주 핵심",
                                 "NASDAQ": "성장주 확대", "채권": "최소 방어", "금": "소폭 분산", "현금": "최소 유지"}}[regime]
              watch = [f"가장 많이 언급된 테마 '{issues[0]['title']}'의 후속 뉴스" if issues else "주요 테마 변화",
                       "VIX 25 상회/16 하회 여부", "코스피·S&P500의 20일선 회복 여부"]
              return {"headline": f"[{rk}] 뉴스 테마: {lead}", "summary": summary, "issues": issues,
                      "weights": sig["weights"], "rationale": why, "watch": watch, "usage": {"model": "rule-digest"}}
          
          # ---------- 출력 ----------
          def write_readme(L):
              h = L["headline_ind"]; rk = {"risk_on": "🟢 위험선호", "neutral": "🟡 중립", "risk_off": "🔴 위험회피"}[L["regime"]]
              s = lambda v: "-" if v is None else f"{'+' if v > 0 else ''}{v}%"
              o = ["# 🧠 시황두뇌", "", f"**{L['as_of']}** · 레짐 {rk} · 작성: {L.get('usage', {}).get('model', '-')}", ""]
              if L.get("ai_error"): o += [f"> ⚠️ AI 해석 실패 (규칙 요약으로 대체): `{L['ai_error']}`", ""]
              if L.get("summary"):
                  o += [f"## {L.get('headline_title', '오늘의 시황')}", "", L["summary"], ""]
                  if L.get("issues"):
                      o += ["## 핵심 이슈", ""]
                      for i in L["issues"]:
                          mark = {"긍정": "🟢", "부정": "🔴"}.get(i.get("impact"), "🟡")
                          o += [f"- {mark} **{i.get('title','')}** — {i.get('detail','')}"]
                      o += [""]
                  o += ["## 포트폴리오와 그 이유", "", "| 자산 | 비중 | 왜 이 비중인가 |", "|---|---:|---|"]
                  o += [f"| {k} | {v}% | {L.get('rationale', {}).get(k, '')} |" for k, v in L["weights"].items()]
                  o += ["", "## 앞으로 지켜볼 것", ""] + [f"- {w}" for w in L.get("watch", [])] + [""]
              else:
                  o += ["> ⚠️ AI 해석이 아직 없습니다. (Actions 로그의 'AI' 항목을 확인하세요)", "",
                        "## 포트폴리오 (규칙 기반)", "", "| 자산 | 비중 |", "|---|---:|"] + [f"| {k} | {v}% |" for k, v in L["weights"].items()] + [""]
              o += ["## 주요 지표", "", "| 지표 | 현재 | 1일 | 5일 | 20일 |", "|---|---:|---:|---:|---:|"]
              o += [f"| {n} | {x.get('last','-')} | {s(x.get('d1'))} | {s(x.get('d5'))} | {s(x.get('d20'))} |" for n, x in h.items()]
              o += ["", "## 규칙 신호", ""] + [f"- {r}" for r in L["reasons"]]
              o += ["", f"## 참고한 뉴스 ({len(L['news'])}건)", ""]
              o += [f"- [{n['title']}]({n['link']}) · {n['src']}" if n.get("link") else f"- {n['title']} · {n['src']}" for n in L["news"][:30]]
              o += ["", "---", f"_뉴스 소스 상태: {', '.join(f'{k} {v}' for k, v in L['news_status'].items())}_",
                    f"_평일 08~17시(KST) 매시 자동 갱신 · AI {L.get('llm_reason','-')} · 투자 권유가 아닌 참고 정보입니다._"]
              (ROOT / "README.md").write_text("\n".join(o), encoding="utf-8")
          
          INDEX_HTML = r"""<!doctype html>
          <html lang="ko">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <title>시황두뇌</title>
          <style>
          :root{--paper:#F4F5F2;--card:#FFFFFF;--ink:#171D1A;--mute:#6A746F;--line:#E1E5E2;--up:#C8342B;--down:#2A5CC2;--accent:#17201C;color-scheme:light}
          @media(prefers-color-scheme:dark){:root{--paper:#111513;--card:#1A1F1C;--ink:#ECEFEA;--mute:#93A09A;--line:#2A312D;--accent:#ECEFEA;color-scheme:dark}}
          *{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
          body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
          main{max-width:680px;margin:0 auto;padding:20px 18px 60px}
          .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);margin-bottom:14px}
          .top b{color:var(--ink);font-size:16px;letter-spacing:-.01em}
          .hero{padding:22px 0 18px;border-bottom:1px solid var(--line)}
          .pill{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;background:#8a8f8c}
          .pill.risk_on{background:var(--up)}.pill.risk_off{background:var(--down)}
          .hero h1{font-size:clamp(24px,6.5vw,34px);line-height:1.25;letter-spacing:-.02em;margin:12px 0 10px;font-weight:800}
          .hero p{margin:0;font-size:16px}
          section{padding:22px 0;border-bottom:1px solid var(--line)}
          h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:600}
          .cards{display:grid;gap:10px}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
          .card .t{font-weight:700;margin-bottom:4px}.card .d{font-size:14.5px;color:var(--mute)}
          .card.pos .t::before{content:"● ";color:var(--up)}.card.neg .t::before{content:"● ";color:var(--down)}.card.mix .t::before{content:"● ";color:#C9A227}
          .w{display:grid;gap:14px}
          .wrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
          .wrow .n{font-weight:700}.wrow .p{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px}
          .wrow .bar{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
          .wrow .bar i{display:block;height:100%;background:var(--accent)}
          .wrow .why{grid-column:1/-1;font-size:14px;color:var(--mute)}
          table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
          td,th{padding:8px 0;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
          th{font-weight:500;color:var(--mute);font-size:12.5px}.pos{color:var(--up)}.neg{color:var(--down)}
          ul{padding-left:18px;margin:0}li{margin:6px 0}
          .news a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}.news small{color:var(--mute)}
          footer{font-size:12px;color:var(--mute);padding-top:18px;line-height:1.7}
          .warn{background:#fff6d6;color:#6b5300;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
          @media(prefers-color-scheme:dark){.warn{background:#3a3010;color:#f1d98a}}
          </style>
          </head>
          <body><main id="app"><p style="color:var(--mute)">불러오는 중…</p></main>
          <script>
          const RK={risk_on:"위험선호",neutral:"중립",risk_off:"위험회피"};
          const f=v=>v==null?"-":(v>0?"+":"")+v.toFixed(2)+"%",c=v=>v==null?"":v>0?"pos":v<0?"neg":"";
          const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
          fetch("data/latest.json?t="+Date.now()).then(r=>r.json()).then(d=>{
            const h=d.headline_ind||{},W=d.weights||{},R=d.rationale||{},max=Math.max(1,...Object.values(W));
            const imp={"긍정":"pos","부정":"neg"};
            document.getElementById("app").innerHTML=`
            <div class="top"><b>🧠 시황두뇌</b><span>${esc(d.as_of)}</span></div>
            <div class="hero"><span class="pill ${d.regime}">${RK[d.regime]||d.regime}</span>
              <h1>${esc(d.headline_title||"오늘의 시황")}</h1><p>${esc(d.summary||"")}</p>
              ${d.ai_error?`<div class="warn">AI 해석이 실패해 규칙 요약으로 대체됨</div>`:""}</div>
            ${(d.issues||[]).length?`<section><h2>핵심 이슈</h2><div class="cards">${d.issues.map(i=>`<div class="card ${imp[i.impact]||"mix"}"><div class="t">${esc(i.title)}</div><div class="d">${esc(i.detail)}</div></div>`).join("")}</div></section>`:""}
            <section><h2>포트폴리오와 그 이유</h2><div class="w">${Object.entries(W).map(([k,v])=>`<div class="wrow"><span class="n">${esc(k)}</span><span class="p">${v}%</span><span class="bar"><i style="width:${v/max*100}%"></i></span>${R[k]?`<span class="why">${esc(R[k])}</span>`:""}</div>`).join("")}</div></section>
            ${(d.watch||[]).length?`<section><h2>앞으로 지켜볼 것</h2><ul>${d.watch.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></section>`:""}
            <section><h2>주요 지표</h2><table><tr><th>지표</th><th>현재</th><th>1일</th><th>5일</th><th>20일</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.last??"-"}</td><td class="${c(x.d1)}">${f(x.d1)}</td><td class="${c(x.d5)}">${f(x.d5)}</td><td class="${c(x.d20)}">${f(x.d20)}</td></tr>`).join("")}</table>
              <p style="font-size:13px;color:var(--mute);margin:12px 0 0">규칙 신호: ${(d.reasons||[]).map(esc).join(" · ")}</p></section>
            <section class="news"><h2>참고한 뉴스 ${(d.news||[]).length}건</h2><ul>${(d.news||[]).slice(0,25).map(n=>`<li>${n.link?`<a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>`:esc(n.title)} <small>· ${esc(n.src)}</small></li>`).join("")}</ul></section>
            <footer>작성: ${esc((d.usage||{}).model||"-")} · ${esc(d.llm_reason||"")}<br>평일 08~17시(KST) 매시 자동 갱신 · 투자 권유가 아닌 참고 정보입니다.</footer>`;
          }).catch(()=>{document.getElementById("app").innerHTML='<p>데이터(data/latest.json)가 아직 없어요. Actions를 한 번 실행해 주세요.</p>'});
          </script></body></html>
          """
          
          PEND = DATA / "pending.json"
          
          def apply(L, out, reason):
              L["headline_title"] = out.get("headline", ""); L["summary"] = out.get("summary", ""); L["issues"] = out.get("issues", [])
              L["weights"] = out.get("weights", L["weights"]); L["rationale"] = out.get("rationale", {}); L["watch"] = out.get("watch", [])
              L["usage"] = out.get("usage", {}); L["llm_reason"] = reason
          
          def prepare():
              """1단계: 수집·지표·뉴스 → pending.json + AI 프롬프트 파일. GITHUB_OUTPUT에 need_ai 기록"""
              closes = collect(); ind = {s: indicators(c) for s, c in closes.items()}
              regime, score, why = regime_of(ind)
              news, status = fetch_news()
              sig = {"as_of": NOW.strftime("%Y-%m-%d %H:%M KST"), "regime": regime, "score": score, "reasons": why,
                     "weights": BASE_WEIGHTS[regime], "headline_ind": {TICKERS[s]: ind[s] for s in TICKERS if ind.get(s)},
                     "news": news, "news_status": status}
              p = DATA / "latest.json"; prev = json.loads(p.read_text(encoding="utf-8")) if p.exists() else None
              use, reason = needs_llm(sig, prev, news); sig["ai_reason"] = reason; sig["need_ai"] = use
              PEND.write_text(json.dumps(sig, ensure_ascii=False), encoding="utf-8")
              payload = {"as_of": sig["as_of"], "regime": regime, "rule_signals": why, "base_weights": BASE_WEIGHTS[regime],
                         "indicators": {k: {kk: v[kk] for kk in ("last", "d1", "d5", "d20")} for k, v in sig["headline_ind"].items()},
                         "news": [f"[{n['src']}] {n['title']}" for n in news]}
              Path("ai_payload.json").write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
              print("prepare:", regime, reason, "need_ai=", use, status)
          
          def finish():
              """2단계: AI 응답 파일 → 없으면 Claude 키 → 없으면 규칙 다이제스트. README 작성"""
              sig = json.loads(PEND.read_text(encoding="utf-8")); L = dict(sig)
              use, reason = sig.pop("need_ai"), sig.pop("ai_reason"); L.pop("need_ai"); L.pop("ai_reason")
              p = DATA / "latest.json"; prev = json.loads(p.read_text(encoding="utf-8")) if p.exists() else None
              payload = json.loads(Path("ai_payload.json").read_text(encoding="utf-8"))
              done = False
              if use:
                  for name, env, fn in (("Gemini", "GEMINI_API_KEY", call_gemini), ("Claude", "ANTHROPIC_API_KEY", call_claude)):
                      if done or not os.getenv(env): continue
                      try: out = fn(payload); apply(L, out, f"호출 ({reason}, {name} {out['usage'].get('model','')})"); done = True; L.pop("ai_error", None)
                      except Exception as e: L["ai_error"] = (L.get("ai_error", "") + f" {name} 실패: {type(e).__name__} {str(e)[:250]}").strip()[:500]
                  if not done:
                      if not (os.getenv("GEMINI_API_KEY") or os.getenv("ANTHROPIC_API_KEY")):
                          L["ai_error"] = "AI 키가 없습니다. GitHub Secret에 GEMINI_API_KEY를 추가하세요."
                      apply(L, rule_digest(sig), "AI 실패 → 규칙 다이제스트")
              elif prev and "summary" in prev:
                  for k in ("headline_title", "summary", "issues", "weights", "rationale", "watch", "usage"):
                      if k in prev: L[k] = prev[k]
                  L["llm_reason"] = f"스킵 ({reason})"
              else:
                  apply(L, rule_digest(sig), f"규칙 다이제스트 ({reason})")
              p.write_text(json.dumps(L, ensure_ascii=False, indent=1), encoding="utf-8")
              write_readme(L); (ROOT / "docs" / "index.html").write_text(INDEX_HTML, encoding="utf-8")
              print("finish:", L["regime"], L["llm_reason"])
              PEND.unlink(missing_ok=True)
          
          if __name__ == "__main__":
              import sys
              prepare() if sys.argv[1:] == ["prepare"] else finish()
          PYEOF

      - name: 1) 수집·지표·뉴스
        env:
          MIN_CHANGE_PCT: ${{ vars.MIN_CHANGE_PCT }}
        run: python brain.py prepare

      - name: 2) AI 해석 + README 작성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python brain.py finish

      - name: 3) 결과 커밋
        run: |
          rm -f brain.py ai_payload.json
          git config user.name "market-brain[bot]"
          git config user.email "market-brain@users.noreply.github.com"
          git add README.md docs
          git diff --cached --quiet && echo "변경 없음" || git commit -m "시황 업데이트 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git push
