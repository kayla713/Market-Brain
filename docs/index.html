<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시황두뇌</title>
<style>:root{--paper:#F3F5F2;--ink:#17201C;--mute:#5E6A64;--line:#D8DDD9;--up:#C8342B;--down:#2A5CC2;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--paper:#121715;--ink:#ECEFEA;--mute:#95A09A;--line:#2B332F;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.55}
main{max-width:720px;margin:0 auto;padding:32px 20px 64px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px}
header h1{font-size:18px;margin:0}header time{font-size:13px;color:var(--mute)}.regime{padding:36px 0 28px;border-bottom:1px solid var(--line)}
.word{font-size:clamp(44px,12vw,80px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}.word.risk_on{color:var(--up)}.word.risk_off{color:var(--down)}
.regime p{margin:12px 0 0;font-size:17px}section{padding:24px 0;border-bottom:1px solid var(--line)}h2{font-size:15px;margin:0 0 12px;color:var(--mute);font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}td,th{padding:7px 0;text-align:right;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left}th{font-weight:500;color:var(--mute);font-size:13px}.pos{color:var(--up)}.neg{color:var(--down)}
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:9em 1fr 3em;align-items:center;gap:10px;font-size:14px}.bar i{display:block;height:10px;background:var(--ink);border-radius:2px}
ul{padding-left:18px;margin:0}li{margin:4px 0}footer{font-size:12px;color:var(--mute);padding-top:16px}</style></head>
<body><main id="app"><p>불러오는 중…</p></main><script>
const R={risk_on:["위험선호","지수가 추세 위, 변동성 낮음."],neutral:["중립","신호가 엇갈림. 기본 비중 유지."],risk_off:["위험회피","추세 이탈 또는 변동성 급등."]};
const f=v=>v==null?"-":(v>0?"+":"")+v.toFixed(2)+"%",c=v=>v==null?"":v>0?"pos":v<0?"neg":"";
fetch("data/latest.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{const [w,desc]=R[d.regime],h=d.headline||{},W=d.weights||{},max=Math.max(...Object.values(W));
document.getElementById("app").innerHTML=`<header><h1>시황두뇌</h1><time>${d.as_of}</time></header>
<div class="regime"><p class="word ${d.regime}">${w}</p><p>${d.summary||desc}</p></div>
<section><h2>주요 지표</h2><table><tr><th>지표</th><th>현재</th><th>1일</th><th>5일</th><th>20일</th></tr>${Object.entries(h).map(([k,x])=>`<tr><td>${k}</td><td>${x.last??"-"}</td><td class="${c(x.d1)}">${f(x.d1)}</td><td class="${c(x.d5)}">${f(x.d5)}</td><td class="${c(x.d20)}">${f(x.d20)}</td></tr>`).join("")}</table></section>
<section><h2>제안 비중</h2><div class="bars">${Object.entries(W).map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/max*100}%"></i><b>${v}%</b></div>`).join("")}</div>${d.portfolio_note?`<p>${d.portfolio_note}</p>`:""}</section>
${d.watch?.length?`<section><h2>체크포인트</h2><ul>${d.watch.map(x=>`<li>${x}</li>`).join("")}</ul></section>`:""}
<section><h2>판단 근거</h2><ul>${(d.reasons||[]).map(x=>`<li>${x}</li>`).join("")}</ul></section>
<footer>평일 08~17시(KST) 매시 자동 갱신 · ${d.llm_reason||""} · 투자 권유가 아닌 참고 정보입니다.</footer>`}).catch(()=>{document.getElementById("app").innerHTML='<p>data/latest.json이 아직 없습니다.</p>'});
</script></body></html>
